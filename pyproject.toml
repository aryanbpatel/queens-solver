[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "queens-solver"
dynamic = ["version"]
description = "Solve LinkedIn's Queens puzzle with binary integer programming (PuLP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan" }]
keywords = ["queens", "puzzle", "integer-programming", "pulp", "optimization", "operations-research"]
dependencies = ["pulp>=3.3,<4"]

[project.optional-dependencies]
png = ["matplotlib>=3.7"]

[project.scripts]
queens = "queens_solver.cli:main"

[tool.setuptools]
packages = ["queens_solver"]

[tool.setuptools.dynamic]
version = { attr = "queens_solver.__version__" }
